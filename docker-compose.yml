services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rabit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rabit_os}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Never publish 5432 to the host in production - internal network only.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rabit} -d ${POSTGRES_DB:-rabit_os}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rabit}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rabit_os}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Host-side ports are deliberately NOT the conventional 8000/3000:
    # Nginx is the only thing on this host that ever talks to these directly
    # (the browser calls same-origin "/api" + "/ws", proxied by Nginx - see
    # apps/web/src/lib/api.ts and infra/nginx/rabit-os.conf.template), so
    # there is no reason to occupy the common 3000/8000 ports that a VPS
    # already running other Node/Python apps is very likely using. Override
    # via .env if 18080/18081 also happen to collide with something.
    ports:
      - "127.0.0.1:${API_PORT:-18081}:8000"
    volumes:
      - ./packages/agent-specs:/app/packages/agent-specs:ro

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-18080}:3000"

volumes:
  postgres_data:
  redis_data:
